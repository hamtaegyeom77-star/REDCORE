<script>
(function(){
  if (localStorage.getItem("redcore_cookie_choice")) return;
  var box=document.createElement("div");
  box.className="rc-cookie";
  box.innerHTML='<p>REDCORE는 사이트 이용 편의를 위해 필요한 쿠키 및 로컬 저장 기능을 사용합니다. 자세한 내용은 개인정보처리방침을 확인해주세요.</p><div class="rc-cookie-actions"><button id="rc-cookie-no">비동의</button><button id="rc-cookie-ok" class="accept">동의</button></div>';
  document.body.appendChild(box);
  function close(choice){ localStorage.setItem("redcore_cookie_choice",choice); box.remove(); }
  document.getElementById("rc-cookie-ok").onclick=function(){close("accepted")};
  document.getElementById("rc-cookie-no").onclick=function(){close("declined")};
})();
</script>
