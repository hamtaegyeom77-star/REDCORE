<script src="script.js"></script>
<script>
function renderSellerDashboard(){
  const root = document.querySelector("#seller-root");
  const seller = currentSeller();
  if(!seller){
    root.innerHTML = `<div class="empty"><p>로그인이 필요합니다.</p><a class="btn" href="seller-login.html" style="margin-top:20px">SELLER LOGIN</a></div>`;
    return;
  }
  const stats = sellerStats(seller.id);
  const won = n => Number(n||0).toLocaleString("ko-KR")+"원";
  root.innerHTML = `
    <h2 style="font-size:18px;margin-bottom:6px">HELLO, ${seller.businessName}</h2>
    <p class="muted" style="font-size:11px;margin-bottom:22px">판매자 상태: <b>${seller.status}</b> · 아이디 ${seller.username}</p>
    <div class="dashboard" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat"><small class="muted">오늘 판매금액</small><b>${won(stats.todaySales)}</b></div>
      <div class="stat"><small class="muted">이번 달 판매금액</small><b>${won(stats.monthSales)}</b></div>
      <div class="stat"><small class="muted">전체 주문수</small><b>${stats.orderCount}</b></div>
      <div class="stat"><small class="muted">배송대기(PAID)</small><b>${stats.counts.PAID}</b></div>
      <div class="stat"><small class="muted">배송중(SHIPPED)</small><b>${stats.counts.SHIPPED}</b></div>
      <div class="stat"><small class="muted">배송완료(DELIVERED)</small><b>${stats.counts.DELIVERED}</b></div>
      <div class="stat"><small class="muted">취소</small><b>${stats.counts.CANCELLED}</b></div>
      <div class="stat"><small class="muted">반품</small><b>${stats.counts.RETURNED}</b></div>
      <div class="stat"><small class="muted">환불</small><b>${stats.counts.REFUNDED}</b></div>
      <div class="stat"><small class="muted">정산 예정금액</small><b>${won(stats.settlementPending)}</b></div>
      <div class="stat"><small class="muted">정산 완료금액</small><b>${won(stats.settlementDone)}</b></div>
      <div class="stat"><small class="muted">내 상품 수</small><b>${sellerProducts.filter(p=>p.sellerId===seller.id).length}</b></div>
    </div>
    <div class="info-card" style="margin-top:24px">
      <h3>정산 계산 방식 (예시)</h3>
      <p>판매가격 100,000원 − REDCORE 수수료(카테고리 기본 ${commissionSettings.default}%) 10,000원 = 판매자 정산금액 90,000원<br>
      실제 카테고리·판매자별 수수료율은 관리자가 설정하며, 위 수치는 계산 구조를 보여주는 예시입니다. 실제 정산 지급은 결제/은행 연동이 필요합니다.</p>
    </div>
  `;
  const logout = document.querySelector("#seller-logout-link");
  if(logout) logout.addEventListener("click", e=>{ e.preventDefault(); sellerLogout(); });
}
document.addEventListener("DOMContentLoaded", renderSellerDashboard);
</script>
</body></html>
